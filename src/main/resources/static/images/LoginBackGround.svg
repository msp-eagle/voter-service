<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eaf3fc"/>
      <stop offset="100%" stop-color="#c9e0f7"/>
    </radialGradient>

    <!-- Top Flag Blue Gradient -->
    <linearGradient id="blueFlagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0038a8"/>
      <stop offset="60%" stop-color="#00246b"/>
      <stop offset="100%" stop-color="#001540"/>
    </linearGradient>

    <!-- Top Flag Red Gradient -->
    <linearGradient id="redFlagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce1126"/>
      <stop offset="70%" stop-color="#a3091b"/>
      <stop offset="100%" stop-color="#78000f"/>
    </linearGradient>
  </defs>

  <!-- Base Radial Fill -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Top Blue Flag Wave -->
  <path d="M 0 0 L 1920 0 L 1920 380 Q 1200 480 0 250 Z" fill="url(#blueFlagGrad)" opacity="0.92"/>

  <!-- Red Flag Wave -->
  <path d="M 0 200 Q 900 420 1920 180 L 1920 440 Q 1100 580 0 350 Z" fill="url(#redFlagGrad)" opacity="0.85"/>

  <!-- White Sun & Stars Flag Triangle -->
  <polygon points="0,0 480,0 0,480" fill="#ffffff" opacity="0.95"/>

  <!-- Golden Philippine Sun -->
  <circle cx="140" cy="140" r="48" fill="#fcd116"/>
  <g stroke="#fcd116" stroke-width="10" stroke-linecap="round">
    <line x1="140" y1="65" x2="140" y2="45"/>
    <line x1="140" y1="215" x2="140" y2="235"/>
    <line x1="65" y1="140" x2="45" y2="140"/>
    <line x1="215" y1="140" x2="235" y2="140"/>
    <line x1="87" y1="87" x2="73" y2="73"/>
    <line x1="193" y1="193" x2="207" y2="207"/>
    <line x1="87" y1="193" x2="73" y2="207"/>
    <line x1="193" y1="87" x2="207" y2="73"/>
  </g>

  <!-- 3 Stars -->
  <polygon points="380,40 384,50 395,50 386,57 389,68 380,60 371,68 374,57 365,50 376,50" fill="#fcd116"/>
  <polygon points="40,380 44,390 55,390 46,397 49,408 40,400 31,408 34,397 25,390 36,390" fill="#fcd116"/>
  <polygon points="40,40 44,50 55,50 46,57 49,68 40,60 31,68 34,57 25,50 36,50" fill="#fcd116"/>

  <!-- Soft Map Silhouette Watermark on Right -->
  <g opacity="0.08" fill="#0038a8">
    <path d="M 1400 150 Q 1550 100 1650 200 T 1750 400 T 1600 650 Q 1500 800 1680 950" fill="none" stroke="#0038a8" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
